name: Keep API alive

on:
  schedule:
    # a cada 8 min — plano free do Render dorme depois de 15 min sem tráfego.
    # O cron do GitHub Actions tem folga (não dispara no segundo exato), então
    # a margem de 8 min (não os 15 completos) é o que sobra pra absorver isso.
    - cron: "*/8 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 60 https://joaoaugusto-portfolio-api.onrender.com/health
