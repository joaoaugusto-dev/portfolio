name: Keep API alive

on:
  schedule:
    # a cada 10 min — plano free do Render dorme depois de 15 min sem tráfego
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 60 https://joaoaugusto-portfolio-api.onrender.com/health
