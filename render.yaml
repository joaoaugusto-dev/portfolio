services:
  - type: web
    name: joaoaugusto-portfolio-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: portfolio
      # Os dois: o site atende em www e o apex responde 308 pro www, mas o admin
      # pode estar em qualquer um dos dois quando faz fetch daqui. Só o apex aqui
      # (como estava) quebra o admin no www se o blueprint ressincronizar — o
      # painel do Render já tinha sido corrigido na mão, este arquivo não.
      - key: CORS_ORIGIN
        value: https://www.joaoaugusto.dev,https://joaoaugusto.dev
      - key: ADMIN_EMAILS
        sync: false
      - key: PORT
        value: 4000
