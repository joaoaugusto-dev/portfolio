services:
  - type: web
    name: joaoaugusto-portfolio-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads
      - key: SUPABASE_COVERS_BUCKET
        value: covers
      - key: CORS_ORIGIN
        value: https://joaoaugusto.dev
      - key: ADMIN_EMAILS
        sync: false
      - key: PORT
        value: 4000
